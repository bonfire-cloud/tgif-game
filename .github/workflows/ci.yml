name: Game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    name: Tests, build and multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real WebSocket room test
        run: |
          npm start > /tmp/tgif-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break || sleep 1; done
          mkdir -p artifacts
          npx tsx tests/network.ts | tee artifacts/ci-network.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-verification
          path: artifacts/ci-network.json
          if-no-files-found: ignore
