name: Game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    name: Tests, build and multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real WebSocket room test
        run: |
          npm start > /tmp/tgif-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break || sleep 1; done
          mkdir -p artifacts
          npx tsx tests/network.ts | tee artifacts/ci-network.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-verification
          path: artifacts/ci-network.json
          if-no-files-found: ignore
  deploy:
    name: Deploy main to Render
    needs: game
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy the tested commit and wait for it to become live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          node --input-type=module <<'JS'
          const secret = process.env.RENDER_DEPLOY_HOOK_URL;
          if (!secret) throw new Error('Missing RENDER_DEPLOY_HOOK_URL repository secret');
          const hook = new URL(secret);
          hook.searchParams.set('ref', process.env.GITHUB_SHA);
          const response = await fetch(hook, { method: 'POST' });
          if (!response.ok) throw new Error(`Render rejected deploy: HTTP ${response.status}`);
          const accepted = await response.json();
          console.log('Render accepted deployment', accepted.deploy?.id || '(queued)');
          for (let attempt = 0; attempt < 72; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 5000));
            try {
              const health = await fetch('https://bonfire-tgif.onrender.com/api/health?ci=' + Date.now(), { signal: AbortSignal.timeout(10000) });
              const data = await health.json();
              if (health.ok && data.revision === process.env.GITHUB_SHA) {
                console.log('Tested commit is live:', data.revision);
                process.exit(0);
              }
            } catch { /* A restart or cold start can briefly interrupt health requests. */ }
          }
          throw new Error('Timed out waiting for the tested commit to become live');
          JS
