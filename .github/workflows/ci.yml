name: Game checks
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real WebSocket room test
        run: |
          npm start > /tmp/tgif-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break || sleep 1; done
          npx tsx tests/network.ts
